# CI: 스타일 검사(빠름)와 빌드+테스트.
#
# 의존성은 셋이다 — Skia 패키지, WebView2 SDK 패키지, submodule 둘(Catch2·nlohmann/json).
# 앞의 둘은 fetch 스크립트가 받고 판번은 핀 파일이 SHA-256과 함께 고정하므로,
# **받아 둔 아카이브만 캐시하면 된다.** 캐시가 맞으면 스크립트가 네트워크를 쓰지
# 않고(해시가 같으면 재사용) 압축만 푼다. 캐시 키가 핀 파일인 것이 그래서다 —
# 판번을 올리면 키가 바뀌고 새로 받는다.
#
# smoke test(실제 창에 한 frame)는 헤드리스 러너에서 제외한다 (-LE smoke).
# OS 설치 글꼴에 기대는 한글·이모지 fallback test도 러너 이미지에 따라
# 흔들릴 수 있어 제외한다.
#
# Debug와 Release를 모두 돌린다. ASan은 /RTC1과의 충돌 때문에 Debug가 아닌
# 구성에만 켜지므로(tests/CMakeLists.txt), Release 실행이 없으면 `asan:` test는
# sanitizer 없이 돌거나 아예 돌지 않는다 — messaging의 ASan 검증은 Release가 한다.
#
# 제3자 action은 태그가 아니라 commit SHA로 고정한다. 태그는 소유자가 옮길 수
# 있어 공급망 공격면이 된다. 갱신은 주석의 버전을 보고 SHA를 함께 바꾼다.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Source style check
        shell: pwsh
        run: scripts/check_source_style.ps1 -root .

  build-test:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out submodules (Catch2 + nlohmann/json)
        run: git submodule update --init --depth 1 third_party/catch2 third_party/nlohmann_json

      # 받아 둔 아카이브를 캐시한다. 푼 결과가 아니라 아카이브를 캐시하는 이유는
      # fetch 스크립트가 해시로 재사용을 판정하기 때문이다 — 푼 트리를 캐시하면
      # 그 판정이 무엇을 보고 있는지가 흐려진다.
      - name: Cache dependency archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            third_party/skia-prep-archives
            third_party/webview2-prep-archives
          key: deps-${{ hashFiles('third_party/skia-prep.json', 'third_party/webview2-prep.json') }}

      - name: Fetch Skia package
        shell: pwsh
        run: scripts/fetch_skia.ps1 -Configuration Debug,Release

      - name: Fetch WebView2 SDK package
        shell: pwsh
        run: scripts/fetch_webview2.ps1

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Configure
        run: cmake --preset vs2022-tests

      - name: Build (Debug)
        run: cmake --build --preset vs2022-tests-debug

      - name: Test (Debug)
        run: ctest --preset vs2022-tests-debug --label-exclude smoke --exclude-regex "Hangul|emoji"

      - name: Build (Release)
        run: cmake --build --preset vs2022-tests-release

      - name: Test (Release)
        run: ctest --preset vs2022-tests-release --label-exclude smoke --exclude-regex "Hangul|emoji"
